<style>
/* ── Layout ── */
.ai-layout{display:grid;grid-template-columns:260px 1fr;gap:0;min-height:calc(100vh - 72px);border-top:1px solid var(--border)}
@media(max-width:760px){.ai-layout{grid-template-columns:1fr}}
.ai-sidebar{background:#f8f9fb;border-right:1px solid var(--border);padding:24px 20px}
@media(max-width:760px){.ai-sidebar{display:none}}
.ai-main{display:flex;flex-direction:column;max-height:calc(100vh - 72px)}

/* ── Sidebar ── */
.sidebar-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
.quick-btn{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:10px 13px;font-size:.88rem;color:var(--navy);font-family:inherit;cursor:pointer;margin-bottom:8px;line-height:1.4;transition:border-color .15s,background .15s}
.quick-btn:hover{border-color:var(--accent);background:#f0fdf4}
.quick-btn .qb-icon{font-size:1rem;margin-right:8px}
.sidebar-divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.sidebar-info{font-size:.8rem;color:var(--muted);line-height:1.5}
.sidebar-info a{color:var(--accent)}

/* ── Chat window ── */
.chat-window{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:16px}
@media(max-width:600px){.chat-window{padding:16px}}
.chat-msg{display:flex;gap:12px;align-items:flex-start;animation:msgIn .2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.user{flex-direction:row-reverse}
.chat-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;margin-top:2px}
.chat-msg.user .chat-avatar{background:var(--navy);color:#fff}
.chat-msg.ai .chat-avatar{background:var(--accent);color:#fff}
.chat-bubble{max-width:76%;padding:12px 16px;border-radius:12px;font-size:.93rem;line-height:1.6}
.chat-msg.user .chat-bubble{background:var(--navy);color:#fff;border-radius:12px 2px 12px 12px}
.chat-msg.ai .chat-bubble{background:#fff;border:1.5px solid var(--border);border-radius:2px 12px 12px 12px}
.chat-bubble p{margin:0 0 8px}
.chat-bubble p:last-child{margin:0}
.chat-bubble ul{margin:4px 0 8px 18px;padding:0}
.chat-bubble li{margin-bottom:4px}
.chat-bubble strong{color:var(--navy)}
.chat-msg.user .chat-bubble strong{color:#fff}
.typing-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#94a3b8;margin:0 2px;animation:blink 1.2s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

/* ── Review card ── */
.review-card{background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:12px;padding:16px 20px;font-size:.88rem}
.review-card h4{margin:0 0 10px;color:var(--navy);font-size:.95rem}
.review-field{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #d1fae5}
.review-field:last-child{border-bottom:none}
.review-label{color:var(--muted);min-width:120px;font-size:.82rem}
.review-value{color:var(--navy);font-weight:500;font-size:.88rem}
.review-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.review-actions .btn-sm{padding:8px 16px;font-size:.85rem;border-radius:7px;cursor:pointer;font-family:inherit;font-weight:600;border:none}
.btn-confirm{background:var(--accent);color:#fff}
.btn-confirm:hover{background:#0a6b62}
.btn-edit{background:transparent;border:1.5px solid var(--border)!important;color:var(--navy)}
.btn-edit:hover{border-color:var(--navy)!important}

/* ── Input bar ── */
.chat-input-bar{border-top:1px solid var(--border);padding:16px 24px;background:#fff;display:flex;gap:10px;align-items:flex-end}
@media(max-width:600px){.chat-input-bar{padding:12px}}
.chat-textarea{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font-family:inherit;font-size:.93rem;color:var(--navy);resize:none;line-height:1.5;min-height:44px;max-height:140px;overflow-y:auto;transition:border-color .15s}
.chat-textarea:focus{outline:none;border-color:var(--accent)}
.chat-send{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-family:inherit;font-size:.93rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s;flex-shrink:0}
.chat-send:hover:not(:disabled){background:#0a6b62}
.chat-send:disabled{opacity:.5;cursor:not-allowed}
.char-hint{font-size:.75rem;color:var(--muted);text-align:right;margin-top:4px}

/* ── Status ── */
.chat-status{font-size:.8rem;color:var(--muted);padding:4px 28px 0;text-align:center}
.error-bubble{background:#fef2f2;border:1.5px solid #fecaca;border-radius:10px;padding:12px 16px;font-size:.88rem;color:#991b1b;max-width:76%}

/* ── Success ── */
.success-screen{text-align:center;padding:48px 24px}
.success-screen .check-icon{font-size:3rem;margin-bottom:16px}
.success-screen h2{color:var(--navy);margin-bottom:8px}
.success-screen p{color:var(--muted);margin-bottom:24px}
</style>

<script src="/assets/nav.js" defer></script>
<script>
(function () {
  'use strict';

  // ── State ──────────────────────────────────────────────────────────────
  var messages = []; // {role: 'user'|'assistant', content: string}
  var sessionData = {}; // structured fields collected
  var isLoading = false;
  var pendingReview = null; // {type, sessionData, conversation}
  var submitted = false;
  var submitting = false; // prevent double-submit

  var chatWindow = document.getElementById('chatWindow');
  var chatInput = document.getElementById('chatInput');
  var sendBtn = document.getElementById('sendBtn');
  var chatStatus = document.getElementById('chatStatus');

  // ── Init ───────────────────────────────────────────────────────────────
  addAIMessage("Hi — I'm the AB Facilities AI assistant. I can answer FM questions, produce a site-specific compliance checklist, help you understand our management fees, or collect what we need for a quote or fault report.\n\nWhat can I help you with today?");

  // Auto-resize textarea
  chatInput.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 140) + 'px';
  });

  // Send on Enter (Shift+Enter = newline)
  chatInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ── Quick prompt buttons ───────────────────────────────────────────────
  window.startPrompt = function (text) {
    chatInput.value = text;
    chatInput.style.height = 'auto';
    chatInput.focus();
    sendMessage();
  };

  // ── Send message ───────────────────────────────────────────────────────
  window.sendMessage = function () {
    var text = chatInput.value.trim();
    if (!text || isLoading || submitted) return;

    addUserMessage(text);
    chatInput.value = '';
    chatInput.style.height = 'auto';
    messages.push({ role: 'user', content: text });

    sendToAPI();
  };

  function sendToAPI() {
    isLoading = true;
    updateSendBtn();
    var typingId = addTyping();
    setStatus('AB Facilities AI is thinking…');

    fetch('/api/ai-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: messages, mode: 'customer', sessionData: sessionData }),
    })
      .then(function (res) { return res.json().then(function (b) { return { ok: res.ok, body: b }; }); })
      .then(function (result) {
        removeTyping(typingId);
        isLoading = false;
        updateSendBtn();
        setStatus('');

        if (!result.ok) {
          addErrorMessage(result.body.error || 'Something went wrong. Please try again or call 07944 308462.');
          return;
        }

        var reply = result.body.reply || '';
        var structured = result.body.structured || {};
        var ready = result.body.ready || false;
        var intent = result.body.intent;

        // Merge any structured data returned
        if (structured && typeof structured === 'object') {
          Object.assign(sessionData, structured);
        }

        addAIMessage(reply);
        messages.push({ role: 'assistant', content: reply });

        // If AI signals ready to submit, show review card
        if (ready && intent && intent !== 'info') {
          pendingReview = { type: intent, sessionData: Object.assign({}, sessionData), conversation: messages.slice() };
          setTimeout(function () { showReviewCard(pendingReview); }, 400);
        }
      })
      .catch(function (err) {
        removeTyping(typingId);
        isLoading = false;
        updateSendBtn();
        setStatus('');
        console.error('API error:', err);
        addErrorMessage('Could not reach the AI service. Please try again or call 07944 308462.');
      });
  }

  // ── Review card ────────────────────────────────────────────────────────
  function showReviewCard(review) {
    var fields = Object.entries(review.sessionData)
      .filter(function (e) { return e[1]; })
      .map(function (e) {
        return '<div class="review-field"><span class="review-label">' + formatKey(e[0]) + '</span><span class="review-value">' + esc(String(e[1])) + '</span></div>';
      }).join('');

    var typeLabel = { enquiry: 'General enquiry', quote: 'Quote request', fault: 'Fault report', checklist: 'Checklist request' }[review.type] || review.type;

    var card = document.createElement('div');
    card.className = 'chat-msg ai';
    card.innerHTML = '<div class="chat-avatar">AB</div><div style="max-width:76%"><div class="review-card">' +
      '<h4>Review your ' + esc(typeLabel) + ' before sending</h4>' +
      (fields || '<p style="color:var(--muted);font-size:.85rem">Details collected from your conversation.</p>') +
      '<div class="review-actions">' +
      '<button class="btn-sm btn-confirm" onclick="submitReview()">Confirm &amp; send ✓</button>' +
      '<button class="btn-sm btn-edit" onclick="editReview()">Edit details</button>' +
      '</div></div></div>';

    chatWindow.appendChild(card);
    scrollToBottom();
  }

  window.submitReview = function () {
    if (!pendingReview || submitting) return; // prevent double-submit
    submitting = true;

    // Disable buttons
    var btns = chatWindow.querySelectorAll('.btn-confirm, .btn-edit');
    btns.forEach(function (b) { b.disabled = true; });

    setStatus('Sending…');

    // Add a unique submission ID so server can log any retries
    var payload = Object.assign({}, pendingReview, {
      submissionId: 'sub-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
    });

    fetch('/api/ai-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    })
      .then(function (res) { return res.json().then(function (b) { return { ok: res.ok, body: b }; }); })
      .then(function (result) {
        setStatus('');
        submitting = false;
        if (result.ok) {
          submitted = true;
          updateSendBtn();
          showSuccessMessage(pendingReview.type);
        } else {
          btns.forEach(function (b) { b.disabled = false; });
          addErrorMessage(result.body.error || 'Could not send. Please call 07944 308462.');
        }
      })
      .catch(function () {
        setStatus('');
        submitting = false;
        btns.forEach(function (b) { b.disabled = false; });
        addErrorMessage('Could not reach our server — please try again. If this keeps happening, call 07944 308462.');
      });
  };

  window.editReview = function () {
    addAIMessage("No problem — tell me what needs changing, or add anything I've missed.");
    pendingReview = null;
  };

  function showSuccessMessage(type) {
    var typeLabel = { enquiry: 'enquiry', quote: 'quote request', fault: 'fault report', checklist: 'request' }[type] || 'message';
    var isFault = type === 'fault';
    var div = document.createElement('div');
    div.className = 'chat-msg ai';
    div.innerHTML = '<div class="chat-avatar">AB</div><div class="chat-bubble">' +
      '<p>✅ <strong>Your ' + esc(typeLabel) + ' has been sent.</strong></p>' +
      '<p>We\'ve sent you a confirmation email. We\'ll be in touch as soon as possible.</p>' +
      (isFault
        ? '<p style="background:#fef3c7;border-left:3px solid #d97706;padding:8px 12px;border-radius:0 6px 6px 0;margin:8px 0 0"><strong>If there is an immediate safety risk</strong>, do not wait for a reply — call 07944 308462 now or contact the emergency services if needed.</p>'
        : '<p>If this is urgent, call us on <a href="tel:+447944308462">07944 308462</a>.</p>'
      ) +
      '</div>';
    chatWindow.appendChild(div);
    scrollToBottom();
  }

  // ── UI helpers ─────────────────────────────────────────────────────────
  function addUserMessage(text) {
    var div = document.createElement('div');
    div.className = 'chat-msg user';
    div.innerHTML = '<div class="chat-avatar">You</div><div class="chat-bubble">' + esc(text).replace(/\n/g, '<br>') + '</div>';
    chatWindow.appendChild(div);
    scrollToBottom();
  }

  function addAIMessage(text) {
    var div = document.createElement('div');
    div.className = 'chat-msg ai';
    div.innerHTML = '<div class="chat-avatar">AB</div><div class="chat-bubble">' + renderMarkdown(text) + '</div>';
    chatWindow.appendChild(div);
    scrollToBottom();
    return div;
  }

  function addErrorMessage(text) {
    var div = document.createElement('div');
    div.className = 'chat-msg ai';
    div.innerHTML = '<div class="chat-avatar" style="background:#ef4444">!</div><div class="error-bubble">' + esc(text) + '</div>';
    chatWindow.appendChild(div);
    scrollToBottom();
  }

  var typingCounter = 0;
  function addTyping() {
    var id = 'typing-' + (++typingCounter);
    var div = document.createElement('div');
    div.className = 'chat-msg ai';
    div.id = id;
    div.innerHTML = '<div class="chat-avatar">AB</div><div class="chat-bubble" style="padding:14px 16px"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>';
    chatWindow.appendChild(div);
    scrollToBottom();
    return id;
  }

  function removeTyping(id) {
    var el = document.getElementById(id);
    if (el) el.remove();
  }

  function scrollToBottom() {
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function updateSendBtn() {
    sendBtn.disabled = isLoading || submitted;
    sendBtn.textContent = isLoading ? 'Sending…' : 'Send';
  }

  function setStatus(text) {
    chatStatus.textContent = text;
  }

  // ── Light Markdown renderer ────────────────────────────────────────────
  function renderMarkdown(text) {
    return text
      .split('\n').map(function (line) {
        // Bullet
        line = line.replace(/^[•\-\*]\s+/, '<li>').replace(/<\/li>$/, '');
        // Bold
        line = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        // Checkbox
        line = line.replace(/☐/g, '<span style="font-size:1.1em">☐</span>');
        return line;
      })
      .join('\n')
      .replace(/(<li>.*\n?)+/g, function (m) { return '<ul>' + m + '</ul>'; })
      .split('\n')
      .map(function (line) {
        if (line.startsWith('<ul>') || line.startsWith('<li>') || line === '') return line;
        return '<p>' + line + '</p>';
      })
      .join('')
      .replace(/<p><\/p>/g, '');
  }

  // ── Utilities ──────────────────────────────────────────────────────────
  function esc(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function formatKey(k) {
    return k.replace(/([A-Z])/g, ' $1').replace(/^./, function (s) { return s.toUpperCase(); }).trim();
  }

})();
</script>
