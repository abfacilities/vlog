<!-- AB Facilities — AB Group identity logo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <style>
      .ab-mono      { font-family: 'Georgia', 'Times New Roman', serif; fill: #0d1f3c; }
      .wordmark-main{ font-family: 'Arial', 'Helvetica Neue', sans-serif; fill: #0d1f3c; letter-spacing: 0.22em; font-weight: 700; }
      .wordmark-sub { font-family: 'Arial', 'Helvetica Neue', sans-serif; fill: #4a5568; letter-spacing: 0.22em; font-weight: 400; }
      .div-name     { font-family: 'Arial', 'Helvetica Neue', sans-serif; fill: #5b21b6; letter-spacing: 0.18em; font-weight: 800; }
    </style>
  </defs>
  <text x="195" y="82" text-anchor="middle" font-size="72" class="ab-mono" font-style="italic">A</text>
  <text x="220" y="82" text-anchor="start"  font-size="72" class="ab-mono" font-style="normal">B</text>
  <line x1="152" y1="93" x2="248" y2="93" stroke="#0e7f74" stroke-width="2.5" stroke-linecap="round"/>
  <text x="200" y="122" text-anchor="middle" font-size="18" class="wordmark-main">FACILITIES</text>
  <text x="200" y="141" text-anchor="middle" font-size="11" class="wordmark-sub">CONSULTANTS</text>
  <line x1="80" y1="162" x2="320" y2="162" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="200" y="210" text-anchor="middle" font-size="56" class="div-name">GROUP</text>
  <text x="200" y="250" text-anchor="middle" font-size="13" style="font-family:'Arial','Helvetica Neue',sans-serif;fill:#0d1f3c;letter-spacing:0.28em;font-weight:700">AB GROUP</text>
</svg>
