<!-- AB Group division mark -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .d-ab { font-family: 'Georgia', 'Times New Roman', serif; fill: #0d1f3c; }
      .d-nm { font-family: 'Arial', 'Helvetica Neue', sans-serif; fill: #5b21b6; letter-spacing: 0.18em; font-weight: 800; }
      .d-lb { font-family: 'Arial', 'Helvetica Neue', sans-serif; fill: #5b21b6; letter-spacing: 0.22em; font-weight: 700; }
    </style>
  </defs>
  <text x="98"  y="92" text-anchor="middle" font-size="72" class="d-ab" font-style="italic">A</text>
  <text x="115" y="92" text-anchor="start"  font-size="72" class="d-ab" font-style="normal">B</text>
  <line x1="62" y1="104" x2="138" y2="104" stroke="#5b21b6" stroke-width="2" stroke-linecap="round"/>
  <text x="100" y="148" text-anchor="middle" font-size="20" class="d-nm">GROUP</text>
  <text x="100" y="168" text-anchor="middle" font-size="11" class="d-lb">AB GROUP</text>
</svg>
